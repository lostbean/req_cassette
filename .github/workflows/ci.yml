name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    name: Test on Elixir (via Nix)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Cache Nix store
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/nix
            /nix/store
          key: ${{ runner.os }}-nix-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-keys: |
            ${{ runner.os }}-nix-
      - name: Cache Mix dependencies
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-
      - name: Install Mix dependencies
        run: nix develop -c mix deps.get
      - name: Compile project
        run: nix develop -c mix compile --warnings-as-errors
      - name: Run tests
        run: nix develop -c mix test
      - name: Check code formatting
        run: nix develop -c mix format --check-formatted
      - name: Run Credo
        run: nix develop -c mix credo

  compatibility:
    # Exercise the lower and upper OTP bounds supported by every Elixir
    # minor accepted by the requirement in mix.exs.
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18.5"
            otp: "25"
          - elixir: "1.18.5"
            otp: "27"
          - elixir: "1.19.5"
            otp: "26"
          - elixir: "1.19.5"
            otp: "28"
          - elixir: "1.20.4"
            otp: "27"
          - elixir: "1.20.4"
            otp: "29"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
      - name: Install Mix dependencies
        run: mix deps.get
      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors
      - name: Run tests
        run: mix test

  req-compatibility:
    # Resolve without mix.lock so every declared Req release line is tested
    # on the minimum supported Elixir release.
    name: Elixir 1.18 / OTP 27 / req ${{ matrix.req }}
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    strategy:
      fail-fast: false
      matrix:
        req: ["0.5.15", "0.6.3", "0.7.4"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.5"
          otp-version: "27"
      - name: Pin req to ${{ matrix.req }}
        run: .github/workflows/pin-req.sh '${{ matrix.req }}'
      - name: Compile with warnings as errors
        run: mix compile --warnings-as-errors
      - name: Run tests
        run: mix test
